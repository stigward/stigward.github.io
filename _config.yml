# Mandatory settings

blog_theme: dark # Or use light
name: Stigward's Security Journal
paginate: 10
url: https://stigward.github.io
baseurl: ''

timezone: America/Denver

description: >-
  A blog focused on vulnerability research, exploit development and general security topics.


# Optional settings

about_enabled: true # Change to true if you wish to show an icon in the navigation that redirects to the about page
discus_identifier: # Add your Disqus identifier
ga_analytics: G-QK87P1LVPH # Add your GA Tracking Id
local_fonts: false # Change to true if you wish to use local fonts
rss_enabled: true # Change to false if not
scrollappear_enabled: true # Change to false to disable
tag_nav_enabled: false # Change to true if you wish to show an additional 'tag-list' navigation below the header
theme_toggle: false # Change to true if you wish to show an icon in the navigation for dynamic theme toggling
social:
  dribbble:
  facebook:
  flickr:
  github: stigward
  linkedin:
  twitter: _stigward
  email: stigward.research@gmail.com
  bitcoin:
  ethereum:
  gitlab:
  youtube:
  twitch:
  discord:
  tumblr:
  bitbucket:
  docker:
  instagram:
  keybase:
  medium:
  spotify:
  stackoverflow:
  steam:


# Important settings (change at own risk)

assets:
  plugins:
    css: { autoprefixer: {}}
    img: { optim: {}}
  source_maps: false
  sources:
    - _assets/icons
    - _assets/javascripts
    - _assets/stylesheets
    - _assets/yarn
collections:
  my_tags:
    output: true
    permalink: /tag/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: articles_by_tag
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - bin/*
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - vendor/
  - yarn.lock
  - temp.txt
plugins:
  - jekyll-assets
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
paginate_path: /posts/page/:num/
permalink: /posts/:title/
