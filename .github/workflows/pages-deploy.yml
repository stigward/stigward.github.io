name: 'Build and deploy'
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

# Required so the GITHUB_TOKEN can push the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # checkout and deploy run natively on the runner (fully supported).
      # Only the build runs in ruby:2.7, because Chalk needs Jekyll 3.8 /
      # jekyll-assets (unsupported by GitHub Pages' native build) plus a JS runtime.
      - name: Build site in ruby:2.7 container
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/srv -w /srv ruby:2.7 bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq nodejs npm
              npm install -g yarn
              yarn install --modules-folder ./_assets/yarn
              gem install bundler -v 2.4.22 -N
              bundle install
              JEKYLL_ENV=production bundle exec jekyll build
              # Hand _site back to the runner user so the deploy step can write .nojekyll into it.
              chown -R "$HOST_UID:$HOST_GID" _site
            '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
